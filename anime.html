<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Anime details, episodes, characters, and more.">
<title>Anime Details - AnimeStream</title>
<style>
:root {
  --bg: #050505; --bg-elevated: #0a0a0a; --surface: #121212; --surface-light: #1a1a1a;
  --primary: #8b5cf6; --primary-light: #a78bfa; --accent: #d946ef;
  --text: #f8fafc; --text-muted: #94a3b8; --text-dim: #64748b;
  --border: rgba(139,92,246,0.15); --glass: rgba(18,18,18,0.75); --glass-border: rgba(139,92,246,0.2);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.8); --glow: 0 0 40px rgba(139,92,246,0.3);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { overflow-x:hidden; max-width:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased; }
img { max-width:100%; height:auto; display:block; }
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; color:inherit; }

.skeleton { background:linear-gradient(90deg,var(--surface) 25%,var(--surface-light) 50%,var(--surface) 75%); background-size:200% 100%; animation:skeleton 1.5s infinite; border-radius:var(--radius-md); }
@keyframes skeleton { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.glass { background:var(--glass); backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%); border:1px solid var(--glass-border); }

/* Header */
.header { position:fixed; top:0; left:0; right:0; z-index:1000; height:clamp(56px,8vh,72px); display:flex; align-items:center; justify-content:space-between; padding:0 clamp(12px,3vw,32px); background:linear-gradient(to bottom,rgba(5,5,5,0.95) 0%,rgba(5,5,5,0.8) 60%,transparent 100%); transition:var(--transition); }
.header.scrolled { background:rgba(5,5,5,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
.header-left, .header-right { display:flex; align-items:center; gap:clamp(8px,1.5vw,16px); flex-shrink:0; }
.menu-btn { width:clamp(36px,5vw,44px); height:clamp(36px,5vw,44px); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; border-radius:var(--radius-sm); transition:var(--transition); }
.menu-btn:hover { background:rgba(139,92,246,0.15); }
.menu-btn span { display:block; width:22px; height:2px; background:var(--text); border-radius:2px; transition:var(--transition); }
.menu-btn.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)} .menu-btn.active span:nth-child(2){opacity:0} .menu-btn.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.logo { font-size:clamp(1.1rem,2.5vw,1.5rem); font-weight:800; background:linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-0.5px; white-space:nowrap; }
.search-btn { width:clamp(36px,5vw,44px); height:clamp(36px,5vw,44px); display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); transition:var(--transition); color:var(--text); flex-shrink:0; }
.search-btn:hover { background:rgba(139,92,246,0.15); color:var(--primary-light); }
.search-btn svg { width:clamp(18px,2.5vw,22px); height:clamp(18px,2.5vw,22px); }

/* Sidebar */
.sidebar { position:fixed; top:0; left:0; bottom:0; width:min(280px,80vw); z-index:1001; background:var(--surface); border-right:1px solid var(--border); transform:translateX(-100%); transition:transform 0.4s cubic-bezier(0.4,0,0.2,1); padding:clamp(16px,4vw,24px); padding-top:clamp(72px,10vh,88px); overflow-y:auto; }
.sidebar.open { transform:translateX(0); }
.sidebar-overlay { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 0.3s; }
.sidebar-overlay.active { opacity:1; pointer-events:all; }
.sidebar-nav { display:flex; flex-direction:column; gap:4px; }
.sidebar-nav a { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:var(--radius-md); font-size:clamp(0.9rem,1.2vw,1rem); font-weight:500; color:var(--text-muted); transition:var(--transition); }
.sidebar-nav a:hover, .sidebar-nav a.active { background:rgba(139,92,246,0.12); color:var(--primary-light); }
.sidebar-nav a svg { width:20px; height:20px; flex-shrink:0; }

/* Search Overlay */
.search-overlay { position:fixed; inset:0; z-index:2000; background:rgba(5,5,5,0.97); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; flex-direction:column; align-items:center; padding:clamp(16px,5vw,48px); padding-top:clamp(80px,12vh,120px); opacity:0; pointer-events:none; transition:opacity 0.4s ease; max-width:100vw; overflow-x:hidden; }
.search-overlay.active { opacity:1; pointer-events:all; }
.search-container { width:100%; max-width:min(800px,92vw); position:relative; }
.search-input-wrap { position:relative; width:100%; }
.search-input { width:100%; padding:clamp(14px,2.5vw,20px) clamp(48px,6vw,64px); font-size:clamp(1rem,2.5vw,1.5rem); background:var(--surface); border:2px solid var(--border); border-radius:var(--radius-xl); color:var(--text); outline:none; transition:var(--transition); max-width:100%; }
.search-input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(139,92,246,0.15),var(--glow); }
.search-icon { position:absolute; left:clamp(16px,2.5vw,24px); top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none; }
.search-icon svg { width:clamp(18px,2.5vw,24px); height:clamp(18px,2.5vw,24px); }
.search-close { position:absolute; right:clamp(12px,2vw,20px); top:50%; transform:translateY(-50%); width:clamp(32px,4vw,40px); height:clamp(32px,4vw,40px); display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--surface-light); color:var(--text-muted); transition:var(--transition); flex-shrink:0; }
.search-close:hover { background:rgba(239,68,68,0.2); color:#ef4444; }
.search-results { width:100%; max-width:min(800px,92vw); margin-top:16px; max-height:calc(100vh - clamp(180px,25vh,240px)); overflow-y:auto; overflow-x:hidden; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); display:none; }
.search-results.active { display:block; }
.search-result-item { display:flex; align-items:center; gap:clamp(12px,2vw,16px); padding:clamp(10px,1.5vw,14px) clamp(14px,2vw,20px); border-bottom:1px solid var(--border); transition:var(--transition); cursor:pointer; max-width:100%; }
.search-result-item:hover { background:rgba(139,92,246,0.08); }
.search-result-item img { width:clamp(48px,8vw,64px); height:clamp(64px,10vw,85px); object-fit:cover; border-radius:var(--radius-sm); flex-shrink:0; }
.search-result-info { min-width:0; flex:1; }
.search-result-title { font-weight:600; font-size:clamp(0.9rem,1.5vw,1.1rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
.search-result-meta { font-size:clamp(0.75rem,1.2vw,0.85rem); color:var(--text-dim); margin-top:4px; }
.search-empty, .search-loading { padding:clamp(24px,4vw,40px); text-align:center; color:var(--text-muted); font-size:clamp(0.9rem,1.5vw,1.1rem); }

/* Anime Banner */
.anime-banner { position:relative; width:100%; min-height:clamp(300px,45vh,550px); margin-top:0; overflow:hidden; }
.anime-banner-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.35) blur(2px); transform:scale(1.1); }
.anime-banner-gradient { position:absolute; inset:0; background:linear-gradient(to top,var(--bg) 0%,rgba(5,5,5,0.7) 50%,rgba(5,5,5,0.3) 100%); z-index:1; }
.anime-banner-content { position:relative; z-index:2; display:flex; gap:clamp(20px,4vw,40px); padding:clamp(100px,15vh,160px) clamp(12px,3vw,32px) clamp(24px,4vh,48px); max-width:1400px; margin:0 auto; align-items:flex-end; flex-wrap:wrap; }
.anime-poster { flex:0 0 auto; width:clamp(140px,22vw,220px); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); position:relative; }
.anime-poster img { width:100%; aspect-ratio:3/4; object-fit:cover; }
.anime-info { flex:1; min-width:min(100%,280px); }
.anime-title { font-size:clamp(1.6rem,4vw,2.8rem); font-weight:800; line-height:1.15; margin-bottom:clamp(8px,1.5vh,16px); background:linear-gradient(to right,#fff,#e2e8f0); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.anime-alt-title { font-size:clamp(0.85rem,1.2vw,1rem); color:var(--text-dim); margin-bottom:clamp(12px,2vh,20px); }
.anime-meta-row { display:flex; flex-wrap:wrap; align-items:center; gap:clamp(8px,1.5vw,16px); margin-bottom:clamp(12px,2vh,20px); font-size:clamp(0.8rem,1.1vw,0.95rem); color:var(--text-muted); }
.anime-score { display:inline-flex; align-items:center; gap:4px; color:#fbbf24; font-weight:700; font-size:clamp(1rem,1.5vw,1.2rem); }
.anime-genres { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:clamp(16px,2.5vh,24px); }
.genre-tag { padding:5px 14px; background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3); border-radius:100px; font-size:clamp(0.7rem,1vw,0.85rem); color:var(--primary-light); backdrop-filter:blur(4px); }
.anime-synopsis { font-size:clamp(0.85rem,1.2vw,1rem); color:var(--text-muted); line-height:1.8; max-width:700px; margin-bottom:clamp(20px,3vh,32px); }
.anime-actions { display:flex; flex-wrap:wrap; gap:clamp(10px,1.5vw,14px); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:clamp(10px,1.8vw,14px) clamp(20px,3vw,28px); border-radius:var(--radius-md); font-size:clamp(0.85rem,1.2vw,1rem); font-weight:600; transition:var(--transition); cursor:pointer; border:none; white-space:nowrap; }
.btn-primary { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; box-shadow:0 4px 20px rgba(139,92,246,0.4); }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(139,92,246,0.5); }
.btn-secondary { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid rgba(255,255,255,0.15); backdrop-filter:blur(8px); }
.btn-secondary:hover { background:rgba(255,255,255,0.15); }

/* Details Grid */
.details-section { padding:clamp(24px,4vw,48px) clamp(12px,3vw,32px); max-width:1400px; margin:0 auto; }
.details-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:clamp(20px,3vw,32px); }
.detail-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:clamp(16px,2.5vw,24px); }
.detail-label { font-size:clamp(0.75rem,1vw,0.85rem); color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.detail-value { font-size:clamp(0.9rem,1.2vw,1.05rem); color:var(--text); font-weight:500; }

/* Trailer */
.trailer-section { padding:0 clamp(12px,3vw,32px) clamp(24px,4vw,48px); max-width:1400px; margin:0 auto; }
.trailer-title { font-size:clamp(1.1rem,2vw,1.4rem); font-weight:700; margin-bottom:clamp(16px,2vh,24px); display:flex; align-items:center; gap:10px; }
.trailer-title::before { content:''; display:block; width:4px; height:clamp(20px,2.5vw,28px); background:linear-gradient(to bottom,var(--primary),var(--accent)); border-radius:100px; }
.trailer-wrap { position:relative; width:100%; aspect-ratio:16/9; border-radius:var(--radius-lg); overflow:hidden; background:var(--surface); border:1px solid var(--border); }
.trailer-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }

/* Episodes */
.episodes-section { padding:0 clamp(12px,3vw,32px) clamp(24px,4vw,48px); max-width:1400px; margin:0 auto; }
.episodes-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:clamp(16px,2vh,24px); flex-wrap:wrap; gap:12px; }
.episodes-title { font-size:clamp(1.1rem,2vw,1.4rem); font-weight:700; display:flex; align-items:center; gap:10px; }
.episodes-title::before { content:''; display:block; width:4px; height:clamp(20px,2.5vw,28px); background:linear-gradient(to bottom,var(--primary),var(--accent)); border-radius:100px; }
.episodes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(100px,14vw,160px),1fr)); gap:clamp(10px,1.5vw,16px); }
.episode-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:clamp(12px,1.5vw,16px); text-align:center; cursor:pointer; transition:var(--transition); }
.episode-card:hover { background:rgba(139,92,246,0.1); border-color:var(--primary); transform:translateY(-3px); }
.episode-num { font-size:clamp(0.9rem,1.2vw,1.1rem); font-weight:700; color:var(--primary-light); }
.episode-label { font-size:clamp(0.7rem,0.9vw,0.8rem); color:var(--text-dim); margin-top:4px; }

/* Characters */
.characters-section { padding:0 clamp(12px,3vw,32px) clamp(24px,4vw,48px); max-width:1400px; margin:0 auto; }
.characters-title { font-size:clamp(1.1rem,2vw,1.4rem); font-weight:700; margin-bottom:clamp(16px,2vh,24px); display:flex; align-items:center; gap:10px; }
.characters-title::before { content:''; display:block; width:4px; height:clamp(20px,2.5vw,28px); background:linear-gradient(to bottom,var(--primary),var(--accent)); border-radius:100px; }
.characters-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(120px,16vw,180px),1fr)); gap:clamp(12px,1.5vw,20px); }
.character-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; transition:var(--transition); }
.character-card:hover { transform:translateY(-4px); box-shadow:var(--shadow); border-color:var(--primary); }
.character-card img { width:100%; aspect-ratio:3/4; object-fit:cover; }
.character-info { padding:clamp(10px,1.2vw,14px); }
.character-name { font-size:clamp(0.8rem,1.1vw,0.95rem); font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.character-role { font-size:clamp(0.7rem,0.9vw,0.8rem); color:var(--text-dim); margin-top:4px; }

/* Recommendations Slider */
.recommendations-section { padding:0 clamp(12px,3vw,32px) clamp(24px,4vw,48px); max-width:1400px; margin:0 auto; }
.recommendations-title { font-size:clamp(1.1rem,2vw,1.4rem); font-weight:700; margin-bottom:clamp(16px,2vh,24px); display:flex; align-items:center; gap:10px; }
.recommendations-title::before { content:''; display:block; width:4px; height:clamp(20px,2.5vw,28px); background:linear-gradient(to bottom,var(--primary),var(--accent)); border-radius:100px; }
.slider-container { position:relative; width:100%; overflow:hidden; max-width:100vw; }
.slider-track { display:flex; gap:clamp(12px,1.5vw,20px); overflow-x:auto; overflow-y:hidden; scroll-behavior:smooth; scroll-snap-type:x mandatory; padding:8px 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.slider-track::-webkit-scrollbar { display:none; }
.anime-card { flex:0 0 auto; width:clamp(140px,18vw,200px); scroll-snap-align:start; position:relative; border-radius:var(--radius-md); overflow:hidden; background:var(--surface); transition:var(--transition); cursor:pointer; }
.anime-card:hover { transform:translateY(-6px) scale(1.02); box-shadow:var(--shadow),var(--glow); z-index:5; }
.anime-card-img { position:relative; aspect-ratio:3/4; overflow:hidden; border-radius:var(--radius-md) var(--radius-md) 0 0; }
.anime-card-img img { width:100%; height:100%; object-fit:cover; transition:transform 0.5s ease; }
.anime-card:hover .anime-card-img img { transform:scale(1.1); }
.anime-card-gradient { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,transparent 50%); pointer-events:none; }
.anime-card-badges { position:absolute; top:8px; left:8px; right:8px; display:flex; flex-wrap:wrap; gap:6px; z-index:2; }
.badge { padding:3px 8px; border-radius:100px; font-size:clamp(0.6rem,0.9vw,0.75rem); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; backdrop-filter:blur(8px); }
.badge-score { background:rgba(251,191,36,0.9); color:#000; }
.badge-ep { background:rgba(16,185,129,0.9); color:#fff; }
.badge-type { background:rgba(59,130,246,0.9); color:#fff; }
.anime-card-info { padding:clamp(10px,1.2vw,14px); }
.anime-card-title { font-size:clamp(0.8rem,1.1vw,0.95rem); font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--text); }
.anime-card-meta { font-size:clamp(0.7rem,0.9vw,0.8rem); color:var(--text-dim); margin-top:6px; }
.section-nav { display:flex; gap:8px; margin-bottom:12px; }
.section-arrow { width:clamp(32px,4vw,40px); height:clamp(32px,4vw,40px); display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--border); color:var(--text-muted); transition:var(--transition); cursor:pointer; flex-shrink:0; }
.section-arrow:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
.section-arrow svg { width:16px; height:16px; }
.section-arrow.disabled { opacity:0.3; pointer-events:none; }

/* Relations */
.relations-section { padding:0 clamp(12px,3vw,32px) clamp(24px,4vw,48px); max-width:1400px; margin:0 auto; }
.relations-title { font-size:clamp(1.1rem,2vw,1.4rem); font-weight:700; margin-bottom:clamp(16px,2vh,24px); display:flex; align-items:center; gap:10px; }
.relations-title::before { content:''; display:block; width:4px; height:clamp(20px,2.5vw,28px); background:linear-gradient(to bottom,var(--primary),var(--accent)); border-radius:100px; }
.relations-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(200px,25vw,280px),1fr)); gap:clamp(12px,1.5vw,20px); }
.relation-card { display:flex; gap:clamp(10px,1.5vw,14px); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:clamp(10px,1.5vw,14px); transition:var(--transition); cursor:pointer; }
.relation-card:hover { border-color:var(--primary); background:rgba(139,92,246,0.05); }
.relation-card img { width:clamp(60px,8vw,80px); aspect-ratio:3/4; object-fit:cover; border-radius:var(--radius-sm); flex-shrink:0; }
.relation-info { min-width:0; flex:1; }
.relation-type { font-size:clamp(0.65rem,0.85vw,0.75rem); color:var(--primary-light); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.relation-name { font-size:clamp(0.8rem,1.1vw,0.95rem); font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Footer */
.footer { padding:clamp(24px,4vw,40px) clamp(12px,3vw,32px); text-align:center; border-top:1px solid var(--border); margin-top:clamp(24px,4vh,48px); }
.footer-text { font-size:clamp(0.8rem,1.1vw,0.9rem); color:var(--text-dim); }

/* Responsive */
@media (max-width:768px) {
  .anime-banner-content { flex-direction:column; align-items:flex-start; padding-top:100px; }
  .anime-poster { width:clamp(120px,40vw,160px); }
  .details-grid { grid-template-columns:1fr; }
  .characters-grid { grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); }
  .anime-card { width:clamp(120px,38vw,160px); }
}
@media (max-width:480px) {
  .anime-title { font-size:1.4rem; }
  .episodes-grid { grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); }
  .relations-grid { grid-template-columns:1fr; }
  .anime-card { width:clamp(110px,42vw,140px); }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
</style>

<header class="header" id="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <a href="index.html" class="logo">AnimeStream</a>
  </div>
  <div class="header-right">
    <button class="search-btn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

      <input type="text" class="search-input" id="searchInput" placeholder="Search anime..." autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="search-close" id="searchClose" aria-label="Close search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

<!-- Anime Banner -->
<section class="anime-banner" id="animeBanner">
  <img class="anime-banner-bg" id="bannerBg" src="" alt="" style="display:none;">
  <div class="anime-banner-gradient"></div>

      <div class="skeleton" style="height:16px;width:40%;margin-bottom:20px;border-radius:4px;"></div>
      <div class="skeleton" style="height:80px;width:100%;max-width:600px;margin-bottom:20px;border-radius:8px;"></div>
      <div class="skeleton" style="height:40px;width:200px;border-radius:8px;"></div>

</section>

<!-- Recommendations -->
<section class="recommendations-section" id="recommendationsSection" style="display:none;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;">

    <div class="section-nav">
      <button class="section-arrow" data-dir="prev" id="recPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="section-arrow" data-dir="next" id="recNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>

  <div class="slider-container"><div class="slider-track" id="recTrack"></div></div>
</section>

<footer class="footer">
  <p class="footer-text">AnimeStream &copy; 2026. All rights reserved. Powered by Jikan API.</p>
</footer>

<script>
const API_BASE = 'https://api.jikan.moe/v4';
const CACHE_TTL = 1000 * 60 * 15;
const RETRIES = 3;
const TIMEOUT = 8000;

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const wait = ms => new Promise(r => setTimeout(r, ms));

function getParam(name) { return new URLSearchParams(location.search).get(name); }
function getCache(key) { try { const item = localStorage.getItem('cache_' + key); if (!item) return null; const p = JSON.parse(item); if (Date.now() - p.ts > CACHE_TTL) { localStorage.removeItem('cache_' + key); return null; } return p.data; } catch(e) { return null; } }
function setCache(key, data) { try { localStorage.setItem('cache_' + key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {} }

async function fetchWithRetry(url, retries = RETRIES) {
  const cacheKey = url.replace(/[^a-z0-9]/gi, '_');
  const cached = getCache(cacheKey); if (cached) return cached;
  for (let i = 0; i < retries; i++) {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), TIMEOUT);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data && data.data) { setCache(cacheKey, data); return data; }
      throw new Error('Invalid response');
    } catch (e) { if (i === retries - 1) return null; await wait(1000 * (i + 1)); }
  }
  return null;
}

function createAnimeCard(anime) {
  if (!anime) return '';
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  const score = anime.score ? anime.score.toFixed(1) : 'N/A';
  const episodes = anime.episodes || '?';
  const type = anime.type || 'TV';
  const year = anime.year || (anime.aired?.from ? new Date(anime.aired.from).getFullYear() : '');
  return `<div class="anime-card" data-id="${anime.mal_id}" onclick="location.href='anime.html?id=${anime.mal_id}'">
    <div class="anime-card-img"><img src="${img}" alt="${anime.title}" loading="lazy"><div class="anime-card-gradient"></div>
      <div class="anime-card-badges"><span class="badge badge-score">${score}</span><span class="badge badge-ep">${episodes} EP</span><span class="badge badge-type">${type}</span></div>
    </div>
    <div class="anime-card-info"><div class="anime-card-title">${anime.title}</div><div class="anime-card-meta">${year} &bull; ${type}</div></div>
  </div>`;
}

/* Header */
const header = $('#header');
window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 50), { passive: true });

/* Sidebar */
const menuBtn = $('#menuBtn');
const sidebar = $('#sidebar');
const sidebarOverlay = $('#sidebarOverlay');
let sidebarOpen = false;
function toggleSidebar() { sidebarOpen = !sidebarOpen; menuBtn.classList.toggle('active', sidebarOpen); sidebar.classList.toggle('open', sidebarOpen); sidebarOverlay.classList.toggle('active', sidebarOpen); document.body.style.overflow = sidebarOpen ? 'hidden' : ''; }
menuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSidebar(); });
sidebarOverlay.addEventListener('click', toggleSidebar);
document.addEventListener('click', (e) => { if (sidebarOpen && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) toggleSidebar(); });

/* Search */
const searchBtn = $('#searchBtn');
const searchOverlay = $('#searchOverlay');
const searchInput = $('#searchInput');
const searchClose = $('#searchClose');
const searchResults = $('#searchResults');
let searchOpen = false, searchDebounce;
function openSearch() { searchOpen = true; searchOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; setTimeout(() => searchInput.focus(), 100); }
function closeSearch() { searchOpen = false; searchOverlay.classList.remove('active'); searchResults.classList.remove('active'); searchResults.innerHTML = ''; searchInput.value = ''; document.body.style.overflow = ''; }
searchBtn.addEventListener('click', openSearch);
searchClose.addEventListener('click', closeSearch);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && searchOpen) closeSearch(); if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchOpen ? closeSearch() : openSearch(); } });
searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (!q) { searchResults.classList.remove('active'); searchResults.innerHTML = ''; return; }
  searchResults.innerHTML = '<div class="search-loading">Searching...</div>'; searchResults.classList.add('active');
  searchDebounce = setTimeout(async () => {
    const data = await fetchWithRetry(`${API_BASE}/anime?q=${encodeURIComponent(q)}&limit=10&sfw=true`);
    if (!data || !data.data || !data.data.length) { searchResults.innerHTML = '<div class="search-empty">No results found</div>'; return; }
    searchResults.innerHTML = data.data.map(a => `<div class="search-result-item" onclick="location.href='anime.html?id=${a.mal_id}'"><img src="${a.images?.jpg?.image_url || ''}" alt="${a.title}" loading="lazy"><div class="search-result-info"><div class="search-result-title">${a.title}</div><div class="search-result-meta">${a.type || 'TV'} &bull; ${a.score || 'N/A'} &bull; ${a.episodes || '?'} eps</div></div></div>`).join('');
  }, 400);
});

/* Slider */
function initSlider(trackId, prevId, nextId) {
  const track = $(trackId); if (!track) return;
  const prev = prevId ? $(prevId) : null;
  const next = nextId ? $(nextId) : null;
  function scroll(dir) { const card = track.querySelector('.anime-card'); const amount = card ? (card.offsetWidth + 16) * 3 : 600; track.scrollBy({ left: dir === 'next' ? amount : -amount, behavior: 'smooth' }); }
  if (prev) prev.addEventListener('click', () => scroll('prev'));
  if (next) next.addEventListener('click', () => scroll('next'));
  track.addEventListener('wheel', (e) => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return; e.preventDefault(); track.scrollLeft += e.deltaY > 0 ? 300 : -300; }, { passive: false });
  let isDown = false, startX, scrollLeft;
  track.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX; scrollLeft = track.scrollLeft; });
  track.addEventListener('mouseleave', () => isDown = false);
  track.addEventListener('mouseup', () => isDown = false);
  track.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); track.scrollLeft = scrollLeft - (e.pageX - startX) * 1.5; });
}

/* Load Anime Data */
const animeId = getParam('id');
if (!animeId) { location.href = 'index.html'; }

async function loadAnime() {
  const id = parseInt(animeId);
  if (!id || isNaN(id)) { location.href = 'index.html'; return; }

  // Fetch all in parallel
  const [animeRes, charRes, recRes, relRes, epRes] = await Promise.allSettled([
    fetchWithRetry(`${API_BASE}/anime/${id}/full`),
    fetchWithRetry(`${API_BASE}/anime/${id}/characters`),
    fetchWithRetry(`${API_BASE}/anime/${id}/recommendations`),
    fetchWithRetry(`${API_BASE}/anime/${id}/relations`),
    fetchWithRetry(`${API_BASE}/anime/${id}/episodes`)
  ]);

  const anime = animeRes.status === 'fulfilled' && animeRes.value ? animeRes.value.data : null;
  if (!anime) {
    $('#animeInfo').innerHTML = '<div style="color:var(--text-muted);padding:20px;">Failed to load anime details. <a href="index.html" style="color:var(--primary-light)">Go home</a></div>';
    return;
  }

  // Render Banner
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
  const bannerBg = $('#bannerBg');
  if (img) { bannerBg.src = img; bannerBg.alt = anime.title; bannerBg.style.display = 'block'; }

  const genres = (anime.genres || []).map(g => `<span class="genre-tag">${g.name}</span>`).join('');
  const studios = (anime.studios || []).map(s => s.name).join(', ') || 'Unknown';
  const aired = anime.aired?.string || 'Unknown';
  const status = anime.status || 'Unknown';
  const rating = anime.rating || 'Unknown';
  const duration = anime.duration || 'Unknown';

  $('#animePoster').classList.remove('skeleton');
  $('#animePoster').innerHTML = `<img src="${anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || ''}" alt="${anime.title}">`;

  $('#animeInfo').innerHTML = `
    <h1 class="anime-title">${anime.title}</h1>
    ${anime.title_english && anime.title_english !== anime.title ? `<div class="anime-alt-title">${anime.title_english}</div>` : ''}
    <div class="anime-meta-row">
      <span class="anime-score"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${anime.score || 'N/A'}</span>
      <span>${anime.type || 'TV'}</span>
      <span>${anime.episodes || '?'} Episodes</span>
      <span>${anime.year || ''}</span>
      <span>${status}</span>
    </div>
    <div class="anime-genres">${genres}</div>
    <p class="anime-synopsis">${anime.synopsis || 'No synopsis available.'}</p>
    <div class="anime-actions">
      <button class="btn btn-primary" onclick="location.href='watch.html?id=${id}&ep=1'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch Now
      </button>
      <button class="btn btn-secondary" onclick="location.href='watch.html?id=${id}&ep=1&sub=0'">Dub</button>
    </div>
  `;

  // Details Grid
  const details = [
    { label: 'Status', value: status },
    { label: 'Aired', value: aired },
    { label: 'Studio', value: studios },
    { label: 'Duration', value: duration },
    { label: 'Rating', value: rating },
    { label: 'Source', value: anime.source || 'Unknown' },
    { label: 'Rank', value: anime.rank ? `#${anime.rank}` : 'N/A' },
    { label: 'Popularity', value: anime.popularity ? `#${anime.popularity}` : 'N/A' },
    { label: 'Members', value: anime.members ? anime.members.toLocaleString() : 'N/A' },
    { label: 'Favorites', value: anime.favorites ? anime.favorites.toLocaleString() : 'N/A' }
  ];
  $('#detailsGrid').innerHTML = details.map(d => `<div class="detail-card"><div class="detail-label">${d.label}</div><div class="detail-value">${d.value}</div></div>`).join('');
  $('#detailsSection').style.display = 'block';

  // Trailer
  const trailer = anime.trailer?.embed_url || anime.trailer?.url;
  if (trailer) {
    const embedUrl = trailer.includes('youtube') ? trailer.replace('watch?v=', 'embed/') : trailer;
    $('#trailerWrap').innerHTML = `<iframe src="${embedUrl}" title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
    $('#trailerSection').style.display = 'block';
  }

  // Episodes
  const eps = epRes.status === 'fulfilled' && epRes.value ? epRes.value.data : [];
  if (eps && eps.length) {
    $('#episodesGrid').innerHTML = eps.slice(0, 24).map((ep, i) => `
      <div class="episode-card" onclick="location.href='watch.html?id=${id}&ep=${ep.mal_id || (i+1)}'">
        <div class="episode-num">${ep.mal_id || (i + 1)}</div>
        <div class="episode-label">${ep.title || 'Episode ' + (i + 1)}</div>
      </div>
    `).join('');
    $('#episodesSection').style.display = 'block';
  } else if (anime.episodes) {
    // Generate placeholder episodes if API returns none
    const count = Math.min(anime.episodes, 24);
    $('#episodesGrid').innerHTML = Array.from({ length: count }, (_, i) => `
      <div class="episode-card" onclick="location.href='watch.html?id=${id}&ep=${i+1}'">
        <div class="episode-num">${i + 1}</div>
        <div class="episode-label">Episode ${i + 1}</div>
      </div>
    `).join('');
    $('#episodesSection').style.display = 'block';
  }

  // Characters
  const chars = charRes.status === 'fulfilled' && charRes.value ? charRes.value.data : [];
  if (chars && chars.length) {
    $('#charactersGrid').innerHTML = chars.slice(0, 12).map(c => `
      <div class="character-card">
        <img src="${c.character?.images?.jpg?.image_url || ''}" alt="${c.character?.name || ''}" loading="lazy">
        <div class="character-info">
          <div class="character-name">${c.character?.name || ''}</div>
          <div class="character-role">${c.role || ''}</div>
        </div>
      </div>
    `).join('');
    $('#charactersSection').style.display = 'block';
  }

  // Relations
  const rels = relRes.status === 'fulfilled' && relRes.value ? relRes.value.data : [];
  if (rels && rels.length) {
    $('#relationsGrid').innerHTML = rels.slice(0, 8).map(r => {
      const entry = r.entry?.[0];
      if (!entry) return '';
      return `
        <div class="relation-card" onclick="location.href='anime.html?id=${entry.mal_id}'">
          <img src="${entry.images?.jpg?.image_url || ''}" alt="${entry.name}" loading="lazy">
          <div class="relation-info">
            <div class="relation-type">${r.relation || ''}</div>
            <div class="relation-name">${entry.name}</div>
          </div>
        </div>
      `;
    }).join('');
    $('#relationsSection').style.display = 'block';
  }

  // Recommendations
  const recs = recRes.status === 'fulfilled' && recRes.value ? recRes.value.data : [];
  if (recs && recs.length) {
    $('#recTrack').innerHTML = recs.slice(0, 12).map(r => createAnimeCard(r.entry)).join('');
    $('#recommendationsSection').style.display = 'block';
    initSlider('#recTrack', '#recPrev', '#recNext');
  }
}

loadAnime();
</script>
</body>
