<title>AnimeStream - Watch HD Anime Online</title>
<style>
/* === CSS VARIABLES & RESET === */
:root {
  --bg: #050505;
  --bg-elevated: #0a0a0a;
  --surface: #121212;
  --surface-light: #1a1a1a;
  --primary: #8b5cf6;
  --primary-light: #a78bfa;
  --accent: #d946ef;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --border: rgba(139, 92, 246, 0.15);
  --glass: rgba(18, 18, 18, 0.75);
  --glass-border: rgba(139, 92, 246, 0.2);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
  --glow: 0 0 40px rgba(139,92,246,0.3);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  overflow-x: hidden;
  max-width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

a {
  text-decoration: none;
  color: inherit;
}

button {
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
}

/* === UTILITY === */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-light) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: skeleton 1.5s infinite;
  border-radius: var(--radius-md);
}
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.glass {
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid var(--glass-border);
}

/* === HEADER === */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  height: clamp(56px, 8vh, 72px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 3vw, 32px);
  background: linear-gradient(to bottom, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.8) 60%, transparent 100%);
  transition: var(--transition);
}

.header.scrolled {
  background: rgba(5,5,5,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.5vw, 16px);
  flex-shrink: 0;
}

.menu-btn {
  width: clamp(36px, 5vw, 44px);
  height: clamp(36px, 5vw, 44px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
  position: relative;
}
.menu-btn:hover { background: rgba(139,92,246,0.15); }
.menu-btn span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: var(--transition);
}
.menu-btn.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.menu-btn.active span:nth-child(2) { opacity: 0; }
.menu-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

.logo {
  font-size: clamp(1.1rem, 2.5vw, 1.5rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
  white-space: nowrap;
}

.search-btn {
  width: clamp(36px, 5vw, 44px);
  height: clamp(36px, 5vw, 44px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: var(--transition);
  color: var(--text);
  flex-shrink: 0;
}
.search-btn:hover { background: rgba(139,92,246,0.15); color: var(--primary-light); }
.search-btn svg {
  width: clamp(18px, 2.5vw, 22px);
  height: clamp(18px, 2.5vw, 22px);
}

/* === SIDEBAR === */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(280px, 80vw);
  z-index: 1001;
  background: var(--surface);
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  padding: clamp(16px, 4vw, 24px);
  padding-top: clamp(72px, 10vh, 88px);
  overflow-y: auto;
}
.sidebar.open { transform: translateX(0); }
.sidebar-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.sidebar-overlay.active { opacity: 1; pointer-events: all; }

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sidebar-nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: clamp(0.9rem, 1.2vw, 1rem);
  font-weight: 500;
  color: var(--text-muted);
  transition: var(--transition);
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: rgba(139,92,246,0.12);
  color: var(--primary-light);
}
.sidebar-nav a svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

/* === SEARCH OVERLAY === */
.search-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(5,5,5,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(16px, 5vw, 48px);
  padding-top: clamp(80px, 12vh, 120px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  max-width: 100vw;
  overflow-x: hidden;
}
.search-overlay.active { opacity: 1; pointer-events: all; }
.search-container {
  width: 100%;
  max-width: min(800px, 92vw);
  position: relative;
}
.search-input-wrap {
  position: relative;
  width: 100%;
}
.search-input {
  width: 100%;
  padding: clamp(14px, 2.5vw, 20px) clamp(48px, 6vw, 64px);
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-xl);
  color: var(--text);
  outline: none;
  transition: var(--transition);
  max-width: 100%;
}
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(139,92,246,0.15), var(--glow);
}
.search-icon {
  position: absolute;
  left: clamp(16px, 2.5vw, 24px);
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}
.search-icon svg { width: clamp(18px, 2.5vw, 24px); height: clamp(18px, 2.5vw, 24px); }
.search-close {
  position: absolute;
  right: clamp(12px, 2vw, 20px);
  top: 50%;
  transform: translateY(-50%);
  width: clamp(32px, 4vw, 40px);
  height: clamp(32px, 4vw, 40px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface-light);
  color: var(--text-muted);
  transition: var(--transition);
  flex-shrink: 0;
}
.search-close:hover { background: rgba(239,68,68,0.2); color: #ef4444; }
.search-results {
  width: 100%;
  max-width: min(800px, 92vw);
  margin-top: 16px;
  max-height: calc(100vh - clamp(180px, 25vh, 240px));
  overflow-y: auto;
  overflow-x: hidden;
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  display: none;
}
.search-results.active { display: block; }
.search-result-item {
  display: flex;
  align-items: center;
  gap: clamp(12px, 2vw, 16px);
  padding: clamp(10px, 1.5vw, 14px) clamp(14px, 2vw, 20px);
  border-bottom: 1px solid var(--border);
  transition: var(--transition);
  cursor: pointer;
  max-width: 100%;
}
.search-result-item:hover { background: rgba(139,92,246,0.08); }
.search-result-item img {
  width: clamp(48px, 8vw, 64px);
  height: clamp(64px, 10vw, 85px);
  object-fit: cover;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.search-result-info {
  min-width: 0;
  flex: 1;
}
.search-result-title {
  font-weight: 600;
  font-size: clamp(0.9rem, 1.5vw, 1.1rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.search-result-meta {
  font-size: clamp(0.75rem, 1.2vw, 0.85rem);
  color: var(--text-dim);
  margin-top: 4px;
}
.search-empty, .search-loading {
  padding: clamp(24px, 4vw, 40px);
  text-align: center;
  color: var(--text-muted);
  font-size: clamp(0.9rem, 1.5vw, 1.1rem);
}

/* === HERO SLIDER === */
.hero {
  position: relative;
  width: 100%;
  height: clamp(450px, 70vh, 900px);
  overflow: hidden;
  margin-top: 0;
}
.hero-slider {
  position: relative;
  width: 100%;
  height: 100%;
}
.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease-in-out;
  pointer-events: none;
}
.hero-slide.active {
  opacity: 1;
  pointer-events: all;
  z-index: 2;
}
.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.45);
  transform: scale(1.05);
  transition: transform 6s ease;
}
.hero-slide.active .hero-bg { transform: scale(1); }
.hero-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--bg) 0%, rgba(5,5,5,0.6) 40%, rgba(5,5,5,0.2) 100%);
  z-index: 1;
}
.hero-content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 2;
  padding: clamp(24px, 5vw, 64px);
  padding-bottom: clamp(40px, 8vh, 80px);

}
.hero-badge {
  display: inline-flex;

  padding: 6px 14px;
  background: rgba(139,92,246,0.2);

  font-size: clamp(0.7rem, 1vw, 0.8rem);

}
.hero-title {
  font-size: clamp(1.8rem, 5vw, 3.5rem);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: clamp(12px, 2vh, 20px);
  text-shadow: 0 4px 30px rgba(0,0,0,0.8);
  background: linear-gradient(to right, #fff, #e2e8f0);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: clamp(8px, 1.5vw, 16px);
  margin-bottom: clamp(12px, 2vh, 20px);
  font-size: clamp(0.8rem, 1.2vw, 0.95rem);

}
.hero-score {

}
.hero-genres {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: clamp(16px, 2.5vh, 24px);
}
.hero-genre {
  padding: 4px 12px;
  background: rgba(255,255,255,0.08);

}
.hero-synopsis {

  margin-bottom: clamp(20px, 3vh, 32px);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 600px;
}
.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(10px, 1.5vw, 16px);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: clamp(10px, 1.8vw, 14px) clamp(20px, 3vw, 32px);
  border-radius: var(--radius-md);
  font-size: clamp(0.85rem, 1.2vw, 1rem);
  font-weight: 600;
  transition: var(--transition);
  cursor: pointer;
  border: none;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  box-shadow: 0 4px 20px rgba(139,92,246,0.4);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(139,92,246,0.5);
}
.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: var(--text);

}
.btn-secondary:hover {

}

.hero-nav {
  position: absolute;
  bottom: clamp(20px, 4vh, 40px);
  right: clamp(16px, 3vw, 32px);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: clamp(12px, 2vw, 20px);
}
.hero-arrow {
  width: clamp(36px, 4vw, 48px);
  height: clamp(36px, 4vw, 48px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text);
  transition: var(--transition);
  cursor: pointer;
  backdrop-filter: blur(8px);
  flex-shrink: 0;
}
.hero-arrow:hover { background: rgba(139,92,246,0.3); border-color: var(--primary); }
.hero-arrow svg { width: clamp(16px, 2vw, 20px); height: clamp(16px, 2vw, 20px); }

}
.hero-dot {

.hero-dot.active {

/* === WIDGETS === */
.section {
  padding: clamp(24px, 4vw, 48px) clamp(12px, 3vw, 32px);
  max-width: 100%;
  overflow-x: hidden;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(16px, 2.5vh, 24px);
  gap: 12px;
  flex-wrap: wrap;
}
.section-title {
  font-size: clamp(1.1rem, 2.2vw, 1.5rem);
  font-weight: 700;
  display: flex;
  align-items: center;

}
.section-title::before {
  content: '';
  display: block;
  width: 4px;
  height: clamp(20px, 2.5vw, 28px);
  background: linear-gradient(to bottom, var(--primary), var(--accent));

}
.section-nav {
  display: flex;
  gap: 8px;

}
.section-arrow {

  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);

}
.section-arrow:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.section-arrow svg { width: 16px; height: 16px; }

.slider-container {

}
.slider-track {
  display: flex;
  gap: clamp(12px, 1.5vw, 20px);
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;

  padding: 8px 4px;

}
.slider-track::-webkit-scrollbar { display: none; }

.anime-card {

  transition: var(--transition);

}

}

}

}
.anime-card-title {

  -webkit-box-orient: vertical;

/* === SKELETON CARDS === */
.skeleton-card {
  flex: 0 0 auto;
  width: clamp(140px, 18vw, 200px);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--surface);
}

  width: 100%;
}

  margin: 12px;

}
.skeleton-text.short { width: 60%; }

/* === FOOTER === */
.footer {
  padding: clamp(24px, 4vw, 40px) clamp(12px, 3vw, 32px);
  text-align: center;
  border-top: 1px solid var(--border);
  margin-top: clamp(24px, 4vh, 48px);
}
.footer-text {
  font-size: clamp(0.8rem, 1.1vw, 0.9rem);
  color: var(--text-dim);
}

  justify-content: center;

}
.footer-social a {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  transition: var(--transition);
}
.footer-social a:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

/* === RESPONSIVE === */
@media (max-width: 768px) {

<script>
/* === CONFIG === */
const API_BASE = 'https://api.jikan.moe/v4';
const CACHE_TTL = 1000 * 60 * 15; // 15 minutes
const RETRIES = 3;
const TIMEOUT = 8000;

/* === UTILITIES === */
const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const wait = ms => new Promise(r => setTimeout(r, ms));

function getCache(key) {
  try {
    const item = localStorage.getItem('cache_' + key);
    if (!item) return null;
    const parsed = JSON.parse(item);
    if (Date.now() - parsed.ts > CACHE_TTL) { localStorage.removeItem('cache_' + key); return null; }
    return parsed.data;
  } catch(e) { return null; }
}
function setCache(key, data) {
  try { localStorage.setItem('cache_' + key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}

async function fetchWithRetry(url, retries = RETRIES) {
  const cacheKey = url.replace(/[^a-z0-9]/gi, '_');
  const cached = getCache(cacheKey);
  if (cached) return cached;

  for (let i = 0; i < retries; i++) {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), TIMEOUT);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data && data.data) { setCache(cacheKey, data); return data; }
      throw new Error('Invalid response');
    } catch (e) {
      if (i === retries - 1) return null;
      await wait(1000 * (i + 1));
    }
  }
  return null;
}

function createSkeleton(count) {
  return Array(count).fill(0).map(() => `
    <div class="skeleton-card skeleton">
      <div class="skeleton-img skeleton"></div>
      <div class="skeleton-text skeleton"></div>
      <div class="skeleton-text short skeleton"></div>
    </div>
  `).join('');
}

function createAnimeCard(anime) {
  if (!anime) return '';
  const img = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  const score = anime.score ? anime.score.toFixed(1) : 'N/A';
  const episodes = anime.episodes || '?';
  const type = anime.type || 'TV';
  const year = anime.year || (anime.aired?.from ? new Date(anime.aired.from).getFullYear() : '');
  return `
    <div class="anime-card" data-id="${anime.mal_id}" onclick="location.href='anime.html?id=${anime.mal_id}'">
      <div class="anime-card-img">
        <img src="${img}" alt="${anime.title}" loading="lazy">
        <div class="anime-card-gradient"></div>
        <div class="anime-card-badges">
          <span class="badge badge-score">${score}</span>
          <span class="badge badge-ep">${episodes} EP</span>
          <span class="badge badge-type">${type}</span>
        </div>
      </div>
      <div class="anime-card-info">
        <div class="anime-card-title">${anime.title}</div>
        <div class="anime-card-meta">${year} &bull; ${type}</div>
      </div>
    </div>
  `;
}

/* === HEADER SCROLL === */
const header = $('#header');
let lastScroll = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  header.classList.toggle('scrolled', y > 50);
  lastScroll = y;
}, { passive: true });

/* === SIDEBAR === */
const menuBtn = $('#menuBtn');
const sidebar = $('#sidebar');
const sidebarOverlay = $('#sidebarOverlay');
let sidebarOpen = false;

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  menuBtn.classList.toggle('active', sidebarOpen);
  sidebar.classList.toggle('open', sidebarOpen);
  sidebarOverlay.classList.toggle('active', sidebarOpen);
  document.body.style.overflow = sidebarOpen ? 'hidden' : '';
}
menuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSidebar(); });
sidebarOverlay.addEventListener('click', toggleSidebar);
document.addEventListener('click', (e) => {
  if (sidebarOpen && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) toggleSidebar();
});

/* === SEARCH OVERLAY === */
const searchBtn = $('#searchBtn');
const searchOverlay = $('#searchOverlay');
const searchInput = $('#searchInput');
const searchClose = $('#searchClose');
const searchResults = $('#searchResults');
let searchOpen = false;
let searchDebounce;

function openSearch() {
  searchOpen = true;
  searchOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  setTimeout(() => searchInput.focus(), 100);
}
function closeSearch() {
  searchOpen = false;
  searchOverlay.classList.remove('active');
  searchResults.classList.remove('active');
  searchResults.innerHTML = '';
  searchInput.value = '';
  document.body.style.overflow = '';
}
searchBtn.addEventListener('click', openSearch);
searchClose.addEventListener('click', closeSearch);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && searchOpen) closeSearch();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchOpen ? closeSearch() : openSearch(); }
});
searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (!q) { searchResults.classList.remove('active'); searchResults.innerHTML = ''; return; }
  searchResults.innerHTML = '<div class="search-loading">Searching...</div>';
  searchResults.classList.add('active');
  searchDebounce = setTimeout(async () => {
    const data = await fetchWithRetry(`${API_BASE}/anime?q=${encodeURIComponent(q)}&limit=10&sfw=true`);
    if (!data || !data.data || !data.data.length) {
      searchResults.innerHTML = '<div class="search-empty">No results found</div>';
      return;
    }
    searchResults.innerHTML = data.data.map(a => `
      <div class="search-result-item" onclick="location.href='anime.html?id=${a.mal_id}'">
        <img src="${a.images?.jpg?.image_url || ''}" alt="${a.title}" loading="lazy">
        <div class="search-result-info">
          <div class="search-result-title">${a.title}</div>
          <div class="search-result-meta">${a.type || 'TV'} &bull; ${a.score || 'N/A'} &bull; ${a.episodes || '?'} eps</div>
        </div>
      </div>
    `).join('');
  }, 400);
});

/* === HERO SLIDER === */
const heroSlider = $('#heroSlider');
const heroDots = $('#heroDots');
let heroData = [];
let heroIndex = 0;
let heroInterval;
let heroTouchStart = 0;
let heroTouchEnd = 0;

function renderHero() {
  if (!heroData.length) {
    heroSlider.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">Failed to load hero</div>';
    return;
  }
  heroSlider.innerHTML = heroData.map((a, i) => {
    const img = a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || '';
    const genres = (a.genres || []).slice(0, 3).map(g => `<span class="hero-genre">${g.name}</span>`).join('');
    return `
      <div class="hero-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
        <img class="hero-bg" src="${img}" alt="${a.title}" loading="${i === 0 ? 'eager' : 'lazy'}">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <div class="hero-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/></svg> Top Anime</div>
          <h1 class="hero-title">${a.title}</h1>
          <div class="hero-meta">
            <span class="hero-score"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ${a.score || 'N/A'}</span>
            <span>${a.type || 'TV'}</span>
            <span>${a.episodes || '?'} Episodes</span>
            <span>${a.year || ''}</span>
          </div>
          <div class="hero-genres">${genres}</div>
          <p class="hero-synopsis">${a.synopsis || ''}</p>
          <div class="hero-buttons">
            <button class="btn btn-primary" onclick="event.stopPropagation();location.href='watch.html?id=${a.mal_id}&ep=1'">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch Now
            </button>
            <button class="btn btn-secondary" onclick="event.stopPropagation();location.href='anime.html?id=${a.mal_id}'">Details</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  heroDots.innerHTML = heroData.map((_, i) => `<button class="hero-dot ${i === 0 ? 'active' : ''}" data-index="${i}" aria-label="Slide ${i + 1}"></button>`).join('');
  $$('.hero-dot').forEach(dot => dot.addEventListener('click', () => goToHero(parseInt(dot.dataset.index))));
}

function goToHero(index) {
  if (!heroData.length) return;
  const slides = $$('.hero-slide');
  const dots = $$('.hero-dot');
  slides[heroIndex]?.classList.remove('active');
  dots[heroIndex]?.classList.remove('active');
  heroIndex = ((index % heroData.length) + heroData.length) % heroData.length;
  slides[heroIndex]?.classList.add('active');
  dots[heroIndex]?.classList.add('active');
}
function nextHero() { goToHero(heroIndex + 1); }
function prevHero() { goToHero(heroIndex - 1); }

$('#heroNext').addEventListener('click', () => { nextHero(); resetHeroTimer(); });
$('#heroPrev').addEventListener('click', () => { prevHero(); resetHeroTimer(); });

function resetHeroTimer() {
  clearInterval(heroInterval);
  heroInterval = setInterval(nextHero, 6000);
}

heroSlider.addEventListener('touchstart', e => { heroTouchStart = e.changedTouches[0].screenX; }, { passive: true });
heroSlider.addEventListener('touchend', e => {
  heroTouchEnd = e.changedTouches[0].screenX;
  if (heroTouchStart - heroTouchEnd > 50) { nextHero(); resetHeroTimer(); }
  else if (heroTouchEnd - heroTouchStart > 50) { prevHero(); resetHeroTimer(); }
}, { passive: true });

let heroMouseDown = false;
let heroMouseStart = 0;
heroSlider.addEventListener('mousedown', e => { heroMouseDown = true; heroMouseStart = e.screenX; });
heroSlider.addEventListener('mouseup', e => {
  if (!heroMouseDown) return;
  heroMouseDown = false;
  const diff = heroMouseStart - e.screenX;
  if (diff > 50) { nextHero(); resetHeroTimer(); }
  else if (diff < -50) { prevHero(); resetHeroTimer(); }
});
heroSlider.addEventListener('mouseleave', () => { heroMouseDown = false; });

/* === UNIVERSAL SLIDER === */
class AnimeSlider {
  constructor(trackId) {
    this.track = $(trackId);
    if (!this.track) return;
    this.container = this.track.closest('.slider-container');
    this.section = this.track.closest('.section');
    this.arrows = this.section ? $$('.section-arrow', this.section) : [];
    this.init();
  }
  init() {
    this.arrows.forEach(arr => arr.addEventListener('click', () => this.scroll(arr.dataset.dir)));
    this.track.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      e.preventDefault();
      this.track.scrollLeft += e.deltaY > 0 ? 300 : -300;
    }, { passive: false });
    let isDown = false, startX, scrollLeft;
    this.track.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX; scrollLeft = this.track.scrollLeft; });
    this.track.addEventListener('mouseleave', () => isDown = false);
    this.track.addEventListener('mouseup', () => isDown = false);
    this.track.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); this.track.scrollLeft = scrollLeft - (e.pageX - startX) * 1.5; });
    this.updateArrows();
    this.track.addEventListener('scroll', () => this.updateArrows(), { passive: true });
    new ResizeObserver(() => this.updateArrows()).observe(this.track);
  }
  scroll(dir) {
    const card = this.track.querySelector('.anime-card, .skeleton-card');
    const amount = card ? (card.offsetWidth + 16) * 4 : 800;
    this.track.scrollBy({ left: dir === 'next' ? amount : -amount, behavior: 'smooth' });
  }
  updateArrows() {
    if (!this.arrows.length) return;
    const max = this.track.scrollWidth - this.track.clientWidth;
    this.arrows[0]?.classList.toggle('disabled', this.track.scrollLeft <= 5);
    this.arrows[1]?.classList.toggle('disabled', this.track.scrollLeft >= max - 5);
  }
  render(data) {
    if (!this.track) return;
    if (!data || !data.length) {
      this.track.innerHTML = '<div style="padding:20px;color:var(--text-muted);width:100%;text-align:center;">No data available</div>';
      return;
    }
    this.track.innerHTML = data.map(createAnimeCard).join('');
    this.updateArrows();
  }
}

/* === DATA LOADING === */
const sliders = {};

async function loadHomeData() {
  // Hero
  const heroRes = await fetchWithRetry(`${API_BASE}/top/anime?limit=10&order_by=popularity`);
  if (heroRes && heroRes.data) {
    heroData = heroRes.data.slice(0, 10);
    renderHero();
    resetHeroTimer();
  } else {
    heroSlider.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">Could not load hero</div>';
  }

  // Widgets with skeletons
  const widgetConfigs = [
    { id: 'recentlyUpdated', endpoint: '/top/anime?limit=12&order_by=members&sort=desc', track: '#recentlyUpdatedTrack' },
    { id: 'trendingNow', endpoint: '/top/anime?limit=12&filter=airing', track: '#trendingNowTrack' },
    { id: 'topRated', endpoint: '/top/anime?limit=12&order_by=score&sort=desc', track: '#topRatedTrack' },
    { id: 'topAiring', endpoint: '/seasons/now?limit=12', track: '#topAiringTrack' },
    { id: 'upcoming', endpoint: '/seasons/upcoming?limit=12', track: '#upcomingTrack' },
    { id: 'completed', endpoint: '/top/anime?limit=12&status=complete', track: '#completedTrack' }
  ];

  // Init skeletons
  widgetConfigs.forEach(w => {
    const track = $(w.track);
    if (track) track.innerHTML = createSkeleton(6);
    sliders[w.id] = new AnimeSlider(w.track);
  });

  // Fetch all widgets with Promise.allSettled
  const results = await Promise.allSettled(
    widgetConfigs.map(w => fetchWithRetry(`${API_BASE}${w.endpoint}`))
  );

  results.forEach((res, i) => {
    const conf = widgetConfigs[i];
    const track = $(conf.track);
    if (!track) return;
    if (res.status === 'fulfilled' && res.value && res.value.data && res.value.data.length) {
      const data = res.value.data;
      sliders[conf.id].render(data);
    } else {
      track.innerHTML = '<div style="padding:20px;color:var(--text-muted);width:100%;text-align:center;">Could not load</div>';
    }
  });
}

/* === LAZY INIT === */
let loaded = false;
function init() {
  if (loaded) return;
  loaded = true;
  loadHomeData();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Re-init on visibility change (tab refocus)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !loaded) init();
});

// Orientation change fix
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    Object.values(sliders).forEach(s => s.updateArrows && s.updateArrows());
  }, 300);
});
</script>
