<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Watch anime episodes in HD with sub and dub options.">
<title>Watch Anime - AnimeStream</title>
<style>
:root {
  --bg: #050505; --bg-elevated: #0a0a0a; --surface: #121212; --surface-light: #1a1a1a;
  --primary: #8b5cf6; --primary-light: #a78bfa; --accent: #d946ef;
  --text: #f8fafc; --text-muted: #94a3b8; --text-dim: #64748b;
  --border: rgba(139,92,246,0.15); --glass: rgba(18,18,18,0.75); --glass-border: rgba(139,92,246,0.2);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.8); --glow: 0 0 40px rgba(139,92,246,0.3);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { overflow-x:hidden; max-width:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased; }
img { max-width:100%; height:auto; display:block; }
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; color:inherit; }

.skeleton { background:linear-gradient(90deg,var(--surface) 25%,var(--surface-light) 50%,var(--surface) 75%); background-size:200% 100%; animation:skeleton 1.5s infinite; border-radius:var(--radius-md); }
@keyframes skeleton { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Header */
.header { position:fixed; top:0; left:0; right:0; z-index:1000; height:clamp(56px,8vh,72px); display:flex; align-items:center; justify-content:space-between; padding:0 clamp(12px,3vw,32px); background:linear-gradient(to bottom,rgba(5,5,5,0.95) 0%,rgba(5,5,5,0.8) 60%,transparent 100%); transition:var(--transition); }
.header.scrolled { background:rgba(5,5,5,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
.header-left, .header-right { display:flex; align-items:center; gap:clamp(8px,1.5vw,16px); flex-shrink:0; }
.menu-btn { width:clamp(36px,5vw,44px); height:clamp(36px,5vw,44px); display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; border-radius:var(--radius-sm); transition:var(--transition); }
.menu-btn:hover { background:rgba(139,92,246,0.15); }
.menu-btn span { display:block; width:22px; height:2px; background:var(--text); border-radius:2px; transition:var(--transition); }
.menu-btn.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)} .menu-btn.active span:nth-child(2){opacity:0} .menu-btn.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.logo { font-size:clamp(1.1rem,2.5vw,1.5rem); font-weight:800; background:linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-0.5px; white-space:nowrap; }
.search-btn { width:clamp(36px,5vw,44px); height:clamp(36px,5vw,44px); display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); transition:var(--transition); color:var(--text); flex-shrink:0; }
.search-btn:hover { background:rgba(139,92,246,0.15); color:var(--primary-light); }
.search-btn svg { width:clamp(18px,2.5vw,22px); height:clamp(18px,2.5vw,22px); }

/* Sidebar */
.sidebar { position:fixed; top:0; left:0; bottom:0; width:min(280px,80vw); z-index:1001; background:var(--surface); border-right:1px solid var(--border); transform:translateX(-100%); transition:transform 0.4s cubic-bezier(0.4,0,0.2,1); padding:clamp(16px,4vw,24px); padding-top:clamp(72px,10vh,88px); overflow-y:auto; }
.sidebar.open { transform:translateX(0); }
.sidebar-overlay { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 0.3s; }
.sidebar-overlay.active { opacity:1; pointer-events:all; }
.sidebar-nav { display:flex; flex-direction:column; gap:4px; }
.sidebar-nav a { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:var(--radius-md); font-size:clamp(0.9rem,1.2vw,1rem); font-weight:500; color:var(--text-muted); transition:var(--transition); }
.sidebar-nav a:hover, .sidebar-nav a.active { background:rgba(139,92,246,0.12); color:var(--primary-light); }
.sidebar-nav a svg { width:20px; height:20px; flex-shrink:0; }

/* Search Overlay */
.search-overlay { position:fixed; inset:0; z-index:2000; background:rgba(5,5,5,0.97); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; flex-direction:column; align-items:center; padding:clamp(16px,5vw,48px); padding-top:clamp(80px,12vh,120px); opacity:0; pointer-events:none; transition:opacity 0.4s ease; max-width:100vw; overflow-x:hidden; }
.search-overlay.active { opacity:1; pointer-events:all; }
.search-container { width:100%; max-width:min(800px,92vw); position:relative; }
.search-input-wrap { position:relative; width:100%; }
.search-input { width:100%; padding:clamp(14px,2.5vw,20px) clamp(48px,6vw,64px); font-size:clamp(1rem,2.5vw,1.5rem); background:var(--surface); border:2px solid var(--border); border-radius:var(--radius-xl); color:var(--text); outline:none; transition:var(--transition); max-width:100%; }
.search-input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(139,92,246,0.15),var(--glow); }
.search-icon { position:absolute; left:clamp(16px,2.5vw,24px); top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none; }
.search-icon svg { width:clamp(18px,2.5vw,24px); height:clamp(18px,2.5vw,24px); }
.search-close { position:absolute; right:clamp(12px,2vw,20px); top:50%; transform:translateY(-50%); width:clamp(32px,4vw,40px); height:clamp(32px,4vw,40px); display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--surface-light); color:var(--text-muted); transition:var(--transition); flex-shrink:0; }
.search-close:hover { background:rgba(239,68,68,0.2); color:#ef4444; }
.search-results { width:100%; max-width:min(800px,92vw); margin-top:16px; max-height:calc(100vh - clamp(180px,25vh,240px)); overflow-y:auto; overflow-x:hidden; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); display:none; }
.search-results.active { display:block; }
.search-result-item { display:flex; align-items:center; gap:clamp(12px,2vw,16px); padding:clamp(10px,1.5vw,14px) clamp(14px,2vw,20px); border-bottom:1px solid var(--border); transition:var(--transition); cursor:pointer; max-width:100%; }
.search-result-item:hover { background:rgba(139,92,246,0.08); }
.search-result-item img { width:clamp(48px,8vw,64px); height:clamp(64px,10vw,85px); object-fit:cover; border-radius:var(--radius-sm); flex-shrink:0; }
.search-result-info { min-width:0; flex:1; }
.search-result-title { font-weight:600; font-size:clamp(0.9rem,1.5vw,1.1rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text); }
.search-result-meta { font-size:clamp(0.75rem,1.2vw,0.85rem); color:var(--text-dim); margin-top:4px; }
.search-empty, .search-loading { padding:clamp(24px,4vw,40px); text-align:center; color:var(--text-muted); font-size:clamp(0.9rem,1.5vw,1.1rem); }

/* Watch Layout */
.watch-wrap { padding-top:clamp(56px,8vh,72px); display:flex; flex-direction:column; min-height:100vh; }
@media (min-width:1024px) {
  .watch-wrap { flex-direction:row; }
  .player-area { flex:1; min-width:0; }
  .sidebar-area { width:clamp(280px,25vw,360px); flex-shrink:0; border-left:1px solid var(--border); overflow-y:auto; max-height:calc(100vh - clamp(56px,8vh,72px)); }
}

/* Player */
.player-section { padding:clamp(12px,2vw,24px); }
.player-container { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border); }
.player-container iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
.player-container.theater { position:fixed; inset:0; z-index:9999; border-radius:0; border:none; }
.player-container.theater iframe { position:fixed; inset:0; width:100vw; height:100vh; }

.player-controls-bar { display:flex; flex-wrap:wrap; align-items:center; gap:clamp(8px,1.5vw,12px); margin-top:clamp(12px,2vh,16px); padding:clamp(10px,1.5vw,14px) clamp(12px,2vw,16px); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); }
.control-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.control-btn { display:inline-flex; align-items:center; gap:6px; padding:clamp(8px,1.2vw,10px) clamp(12px,2vw,16px); border-radius:var(--radius-sm); background:rgba(139,92,246,0.12); border:1px solid rgba(139,92,246,0.25); color:var(--primary-light); font-size:clamp(0.8rem,1.1vw,0.9rem); font-weight:600; transition:var(--transition); cursor:pointer; white-space:nowrap; }
.control-btn:hover { background:rgba(139,92,246,0.25); }
.control-btn.active { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; border-color:transparent; }
.control-btn svg { width:16px; height:16px; }

.ep-nav { display:flex; gap:8px; }
.ep-nav-btn { display:inline-flex; align-items:center; gap:6px; padding:clamp(8px,1.2vw,10px) clamp(12px,2vw,16px); border-radius:var(--radius-sm); background:var(--surface-light); border:1px solid var(--border); color:var(--text-muted); font-size:clamp(0.8rem,1.1vw,0.9rem); font-weight:600; transition:var(--transition); cursor:pointer; white-space:nowrap; }
.ep-nav-btn:hover { background:rgba(255,255,255,0.08); color:var(--text); }
.ep-nav-btn:disabled { opacity:0.4; pointer-events:none; }

.server-selector { display:flex; gap:8px; flex-wrap:wrap; }
.server-btn { padding:6px 12px; border-radius:var(--radius-sm); background:var(--surface-light); border:1px solid var(--border); color:var(--text-muted); font-size:clamp(0.75rem,1vw,0.85rem); font-weight:600; transition:var(--transition); cursor:pointer; }
.server-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }

/* Info Section */
.info-section { padding:clamp(12px,2vw,24px); padding-top:0; }
.info-title { font-size:clamp(1.1rem,2.5vw,1.6rem); font-weight:700; margin-bottom:clamp(8px,1.5vh,12px); line-height:1.3; }
.info-meta { display:flex; flex-wrap:wrap; align-items:center; gap:clamp(8px,1.5vw,14px); color:var(--text-muted); font-size:clamp(0.8rem,1.1vw,0.9rem); margin-bottom:clamp(12px,2vh,16px); }
.info-desc { font-size:clamp(0.85rem,1.2vw,1rem); color:var(--text-muted); line-height:1.7; max-width:800px; }

/* Episode Sidebar */
.sidebar-area { background:var(--bg-elevated); }
.episode-list-header { padding:clamp(16px,2.5vw,20px); border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-elevated); z-index:10; }
.episode-list-title { font-size:clamp(1rem,1.5vw,1.2rem); font-weight:700; margin-bottom:12px; }
.episode-filter { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.episode-search { width:100%; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:0.9rem; outline:none; }
.episode-search:focus { border-color:var(--primary); }
.episode-list { padding:clamp(8px,1.5vw,12px); display:flex; flex-direction:column; gap:6px; }
.episode-item { display:flex; align-items:center; gap:clamp(10px,1.5vw,14px); padding:clamp(10px,1.5vw,12px); border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--border); cursor:pointer; transition:var(--transition); }
.episode-item:hover, .episode-item.active { background:rgba(139,92,246,0.12); border-color:var(--primary); }
.episode-item-thumb { width:clamp(60px,8vw,80px); aspect-ratio:16/9; border-radius:var(--radius-sm); overflow:hidden; flex-shrink:0; background:var(--surface-light); }
.episode-item-thumb img { width:100%; height:100%; object-fit:cover; }
.episode-item-info { min-width:0; flex:1; }
.episode-item-num { font-weight:700; font-size:clamp(0.85rem,1.1vw,0.95rem); color:var(--primary-light); }
.episode-item-title { font-size:clamp(0.75rem,1vw,0.85rem); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

/* Related */
.related-section { padding:clamp(12px,2vw,24px); }
.related-title { font-size:clamp(1rem,1.8vw,1.3rem); font-weight:700; margin-bottom:clamp(12px,2vh,16px); }
.related-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(120px,16vw,160px),1fr)); gap:clamp(10px,1.5vw,14px); }
.related-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; cursor:pointer; transition:var(--transition); }
.related-card:hover { transform:translateY(-4px); border-color:var(--primary); }
.related-card img { width:100%; aspect-ratio:3/4; object-fit:cover; }
.related-info { padding:clamp(8px,1.2vw,10px); }
.related-name { font-size:clamp(0.75rem,1vw,0.85rem); font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Comments UI */
.comments-section { padding:clamp(12px,2vw,24px); max-width:900px; }
.comments-title { font-size:clamp(1rem,1.8vw,1.3rem); font-weight:700; margin-bottom:clamp(12px,2vh,16px); }
.comment-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:clamp(12px,2vw,16px); margin-bottom:16px; }
.comment-input { width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:0.9rem; outline:none; resize:vertical; min-height:80px; margin-bottom:10px; }
.comment-input:focus { border-color:var(--primary); }
.comment-submit { padding:10px 20px; background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; border-radius:var(--radius-sm); font-weight:600; font-size:0.9rem; cursor:pointer; transition:var(--transition); border:none; }
.comment-submit:hover { transform:translateY(-2px); box-shadow:0 4px 15px rgba(139,92,246,0.4); }
.comment-item { display:flex; gap:12px; padding:clamp(12px,2vw,14px); border-bottom:1px solid var(--border); }
.comment-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; flex-shrink:0; }
.comment-body { flex:1; min-width:0; }
.comment-author { font-weight:700; font-size:0.9rem; color:var(--text); }
.comment-time { font-size:0.75rem; color:var(--text-dim); margin-left:8px; }
.comment-text { font-size:0.85rem; color:var(--text-muted); margin-top:4px; line-height:1.5; }

/* Footer */
.footer { padding:clamp(24px,4vw,40px) clamp(12px,3vw,32px); text-align:center; border-top:1px solid var(--border); margin-top:auto; }
.footer-text { font-size:clamp(0.8rem,1.1vw,0.9rem); color:var(--text-dim); }

/* Responsive */
@media (max-width:768px) {
  .player-controls-bar { gap:8px; }
  .control-group { width:100%; justify-content:center; }
  .ep-nav { width:100%; justify-content:center; }
  .info-title { font-size:1.2rem; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }
</style>
<base target="_blank">

<body>

<header class="header" id="header">
  <div class="header-left">
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <a href="index.html" class="logo">AnimeStream</a>
  </div>
  <div class="header-right">
    <button class="search-btn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <nav class="sidebar-nav">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a>
    <a href="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Search</a>
    <a href="schedule.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Schedule</a>
    <a href="creator.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 12 2.1 10.5"/><path d="M12 12v10"/></svg>Creator</a>
  </nav>
</aside>

<div class="search-overlay" id="searchOverlay">
  <div class="search-container">
    <div class="search-input-wrap">
      <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search anime..." autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="search-close" id="searchClose" aria-label="Close search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="watch-wrap">
  <div class="player-area">
    <div class="player-section">
      <div class="player-container" id="playerContainer">
        <iframe id="videoFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="eager"></iframe>
      </div>
      <div class="player-controls-bar">
        <div class="control-group server-selector">
          <button class="server-btn active" data-server="megaplay" onclick="switchServer('megaplay')">MegaPlay</button>
        </div>
        <div class="control-group">
          <button class="control-btn active" id="subBtn" onclick="toggleSubDub('sub')">SUB</button>
          <button class="control-btn" id="dubBtn" onclick="toggleSubDub('dub')">DUB</button>
        </div>
        <div class="control-group ep-nav">
          <button class="ep-nav-btn" id="prevEpBtn" onclick="changeEpisode(currentEp - 1)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Prev
          </button>
          <button class="ep-nav-btn" id="nextEpBtn" onclick="changeEpisode(currentEp + 1)">
            Next <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="control-btn" id="theaterBtn" onclick="toggleTheater()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Theater
          </button>
        </div>
      </div>
    </div>

    <div class="info-section" id="infoSection">
      <h1 class="info-title skeleton" id="infoTitle" style="height:clamp(1.1rem,2.5vw,1.6rem);width:60%;border-radius:8px;"></h1>
      <div class="info-meta skeleton" id="infoMeta" style="height:20px;width:40%;border-radius:4px;"></div>
      <div class="info-desc skeleton" id="infoDesc" style="height:60px;width:100%;border-radius:8px;"></div>
    </div>

    <div class="related-section" id="relatedSection" style="display:none;">
      <h2 class="related-title">Related Anime</h2>
      <div class="related-grid" id="relatedGrid"></div>
    </div>

    <div class="comments-section">
      <h2 class="comments-title">Comments</h2>
      <div class="comment-box">
        <textarea class="comment-input" placeholder="Share your thoughts..."></textarea>
        <button class="comment-submit">Post Comment</button>
      </div>
      <div id="commentsList">
        <div class="comment-item">
          <div class="comment-avatar">A</div>
          <div class="comment-body">
            <div class="comment-author">AnimeFan <span class="comment-time">2 hours ago</span></div>
            <div class="comment-text">Great episode! The animation quality is amazing.</div>
          </div>
        </div>
        <div class="comment-item">
          <div class="comment-avatar">K</div>
          <div class="comment-body">
            <div class="comment-author">KimiUser <span class="comment-time">5 hours ago</span></div>
            <div class="comment-text">Can't wait for the next episode. This arc is getting intense!</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="sidebar-area" id="sidebarArea">
    <div class="episode-list-header">
      <div class="episode-list-title">Episodes</div>
      <div class="episode-filter">
        <button class="control-btn active" onclick="filterEps('all')">All</button>
        <button class="control-btn" onclick="filterEps('sub')">SUB</button>
        <button class="control-btn" onclick="filterEps('dub')">DUB</button>
      </div>
      <input type="text" class="episode-search" id="epSearch" placeholder="Search episode..." oninput="searchEpisodes(this.value)">
    </div>
    <div class="episode-list" id="episodeList"></div>
  </aside>
</div>

<footer class="footer">
  <p class="footer-text">AnimeStream &copy; 2026. All rights reserved. Powered by Jikan API.</p>
</footer>

<script>
const API_BASE = 'https://api.jikan.moe/v4';
const CACHE_TTL = 1000 * 60 * 15;
const RETRIES = 3;
const TIMEOUT = 8000;

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
const wait = ms => new Promise(r => setTimeout(r, ms));

function getParam(name) { return new URLSearchParams(location.search).get(name); }
function getCache(key) { try { const item = localStorage.getItem('cache_' + key); if (!item) return null; const p = JSON.parse(item); if (Date.now() - p.ts > CACHE_TTL) { localStorage.removeItem('cache_' + key); return null; } return p.data; } catch(e) { return null; } }
function setCache(key, data) { try { localStorage.setItem('cache_' + key, JSON.stringify({ ts: Date.now(), data })); } catch(e) {} }

async function fetchWithRetry(url, retries = RETRIES) {
  const cacheKey = url.replace(/[^a-z0-9]/gi, '_');
  const cached = getCache(cacheKey); if (cached) return cached;
  for (let i = 0; i < retries; i++) {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), TIMEOUT);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data && data.data) { setCache(cacheKey, data); return data; }
      throw new Error('Invalid response');
    } catch (e) { if (i === retries - 1) return null; await wait(1000 * (i + 1)); }
  }
  return null;
}

/* Header */
const header = $('#header');
window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 50), { passive: true });

/* Sidebar */
const menuBtn = $('#menuBtn');
const sidebar = $('#sidebar');
const sidebarOverlay = $('#sidebarOverlay');
let sidebarOpen = false;
function toggleSidebar() { sidebarOpen = !sidebarOpen; menuBtn.classList.toggle('active', sidebarOpen); sidebar.classList.toggle('open', sidebarOpen); sidebarOverlay.classList.toggle('active', sidebarOpen); document.body.style.overflow = sidebarOpen ? 'hidden' : ''; }
menuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSidebar(); });
sidebarOverlay.addEventListener('click', toggleSidebar);
document.addEventListener('click', (e) => { if (sidebarOpen && !sidebar.contains(e.target) && !menuBtn.contains(e.target)) toggleSidebar(); });

/* Search */
const searchBtn = $('#searchBtn');
const searchOverlay = $('#searchOverlay');
const searchInput = $('#searchInput');
const searchClose = $('#searchClose');
const searchResults = $('#searchResults');
let searchOpen = false, searchDebounce;
function openSearch() { searchOpen = true; searchOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; setTimeout(() => searchInput.focus(), 100); }
function closeSearch() { searchOpen = false; searchOverlay.classList.remove('active'); searchResults.classList.remove('active'); searchResults.innerHTML = ''; searchInput.value = ''; document.body.style.overflow = ''; }
searchBtn.addEventListener('click', openSearch);
searchClose.addEventListener('click', closeSearch);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && searchOpen) closeSearch(); if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchOpen ? closeSearch() : openSearch(); } });
searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (!q) { searchResults.classList.remove('active'); searchResults.innerHTML = ''; return; }
  searchResults.innerHTML = '<div class="search-loading">Searching...</div>'; searchResults.classList.add('active');
  searchDebounce = setTimeout(async () => {
    const data = await fetchWithRetry(`${API_BASE}/anime?q=${encodeURIComponent(q)}&limit=10&sfw=true`);
    if (!data || !data.data || !data.data.length) { searchResults.innerHTML = '<div class="search-empty">No results found</div>'; return; }
    searchResults.innerHTML = data.data.map(a => `<div class="search-result-item" onclick="location.href='anime.html?id=${a.mal_id}'"><img src="${a.images?.jpg?.image_url || ''}" alt="${a.title}" loading="lazy"><div class="search-result-info"><div class="search-result-title">${a.title}</div><div class="search-result-meta">${a.type || 'TV'} &bull; ${a.score || 'N/A'} &bull; ${a.episodes || '?'} eps</div></div></div>`).join('');
  }, 400);
});

/* Player State */
const animeId = getParam('id');
let currentEp = parseInt(getParam('ep')) || 1;
let currentSubDub = getParam('sub') !== '0' ? 'sub' : 'dub';
let totalEps = 1;
let animeData = null;

if (!animeId) { location.href = 'index.html'; }

function getStreamUrl(id, ep, type) {
  return `https://megaplay.buzz/stream/mal/${id}/${ep}/${type}`;
}

function loadPlayer() {
  const url = getStreamUrl(animeId, currentEp, currentSubDub);
  $('#videoFrame').src = url;
  $('#subBtn').classList.toggle('active', currentSubDub === 'sub');
  $('#dubBtn').classList.toggle('active', currentSubDub === 'dub');
  updateNavButtons();
  highlightEpisode();
  history.replaceState(null, '', `?id=${animeId}&ep=${currentEp}${currentSubDub === 'dub' ? '&sub=0' : ''}`);
}

function toggleSubDub(type) {
  currentSubDub = type;
  loadPlayer();
}

function changeEpisode(ep) {
  if (ep < 1 || ep > totalEps) return;
  currentEp = ep;
  loadPlayer();
  // Auto scroll to top on mobile
  if (window.innerWidth < 1024) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavButtons() {
  $('#prevEpBtn').disabled = currentEp <= 1;
  $('#nextEpBtn').disabled = currentEp >= totalEps;
}

function toggleTheater() {
  $('#playerContainer').classList.toggle('theater');
  const btn = $('#theaterBtn');
  if ($('#playerContainer').classList.contains('theater')) {
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg> Exit';
    document.body.style.overflow = 'hidden';
  } else {
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Theater';
    document.body.style.overflow = '';
  }
}

function switchServer(server) {
  $$('.server-btn').forEach(b => b.classList.toggle('active', b.dataset.server === server));
  loadPlayer();
}

/* Episode List */
function renderEpisodes(count) {
  const list = $('#episodeList');
  list.innerHTML = Array.from({ length: count }, (_, i) => {
    const ep = i + 1;
    return `
      <div class="episode-item ${ep === currentEp ? 'active' : ''}" data-ep="${ep}" onclick="changeEpisode(${ep})">
        <div class="episode-item-thumb">
          <img src="${animeData?.images?.jpg?.image_url || ''}" alt="EP ${ep}" loading="lazy">
        </div>
        <div class="episode-item-info">
          <div class="episode-item-num">Episode ${ep}</div>
          <div class="episode-item-title">${animeData?.title || ''}</div>
        </div>
      </div>
    `;
  }).join('');
}

function highlightEpisode() {
  $$('.episode-item').forEach(el => el.classList.toggle('active', parseInt(el.dataset.ep) === currentEp));
}

function searchEpisodes(query) {
  const q = query.toLowerCase();
  $$('.episode-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? 'flex' : 'none';
  });
}

function filterEps(type) {
  $$('.episode-filter .control-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (type === 'all') { $$('.episode-item').forEach(el => el.style.display = 'flex'); }
  else { /* visual filter only, both point to same stream */ $$('.episode-item').forEach(el => el.style.display = 'flex'); }
}

/* Keyboard Shortcuts */
document.addEventListener('keydown', (e) => {
  if (searchOpen) return;
  if (e.key === 'ArrowRight') changeEpisode(currentEp + 1);
  if (e.key === 'ArrowLeft') changeEpisode(currentEp - 1);
  if (e.key === 'f' || e.key === 'F') toggleTheater();
  if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleSubDub(currentSubDub === 'sub' ? 'dub' : 'sub'); }
});

/* Load Data */
async function loadWatchData() {
  const id = parseInt(animeId);
  if (!id || isNaN(id)) { location.href = 'index.html'; return; }

  const animeRes = await fetchWithRetry(`${API_BASE}/anime/${id}/full`);
  const recRes = await fetchWithRetry(`${API_BASE}/anime/${id}/recommendations`);

  animeData = animeRes && animeRes.data ? animeRes.data : null;
  if (!animeData) {
    $('#infoTitle').classList.remove('skeleton');
    $('#infoTitle').textContent = 'Failed to load anime data';
    $('#infoMeta').style.display = 'none';
    $('#infoDesc').style.display = 'none';
    return;
  }

  totalEps = animeData.episodes || 1;

  // Info
  $('#infoTitle').classList.remove('skeleton');
  $('#infoTitle').textContent = `${animeData.title} - Episode ${currentEp}`;
  $('#infoMeta').classList.remove('skeleton');
  $('#infoMeta').innerHTML = `
    <span>${animeData.type || 'TV'}</span>
    <span>${animeData.score ? animeData.score + ' ★' : 'N/A'}</span>
    <span>EP ${currentEp} / ${totalEps}</span>
    <span>${currentSubDub.toUpperCase()}</span>
  `;
  $('#infoDesc').classList.remove('skeleton');
  $('#infoDesc').textContent = animeData.synopsis || 'No synopsis available.';

  // Episodes
  renderEpisodes(totalEps);
  updateNavButtons();

  // Related
  const recs = recRes && recRes.data ? recRes.data.slice(0, 6) : [];
  if (recs.length) {
    $('#relatedGrid').innerHTML = recs.map(r => `
      <div class="related-card" onclick="location.href='anime.html?id=${r.entry.mal_id}'">
        <img src="${r.entry.images?.jpg?.image_url || ''}" alt="${r.entry.title}" loading="lazy">
        <div class="related-info"><div class="related-name">${r.entry.title}</div></div>
      </div>
    `).join('');
    $('#relatedSection').style.display = 'block';
  }

  // Load player
  loadPlayer();
}

loadWatchData();
</script>
</body>
</html>
